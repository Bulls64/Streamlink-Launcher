name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all modules
        run: python -m compileall -q launcher slink_launcher.py
      - name: Static analysis (ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install ruff==0.17.0
          python -m ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: GUI smoke test (Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash packaging/ci_apt.sh xvfb python3-tk
          xvfb-run -a python -m unittest tests.test_gui tests.test_gui_desktop -v

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Measure (all tests, interface included, under Xvfb)
        run: |
          bash packaging/ci_apt.sh xvfb python3-tk
          python -m pip install coverage==7.13.5
          xvfb-run -a python -m coverage run -m unittest discover -s tests
      - name: Report (fails under the threshold set in .coveragerc)
        run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report

  build:
    name: Build the .exe
    # Sur chaque PR (pour vérifier que l'exe se construit) et sur les tags de version
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Read the version (and check the tag)
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import launcher; print(launcher.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match launcher.__version__ ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build (PyInstaller bootloader compiled from source)
        shell: cmd
        env:
          BUILD_BOOTLOADER: "1"
          PY: python
        run: packaging\build_exe.bat
      - name: Check that the bootloader was really compiled here
        run: python packaging/check_bootloader.py
      - name: Rename the executable
        shell: bash
        run: mv "dist/Streamlink Launcher.exe" "dist/StreamlinkLauncher-${{ steps.version.outputs.version }}.exe"
      - name: Upload the unsigned executable
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/StreamlinkLauncher-${{ steps.version.outputs.version }}.exe
          archive: false
          if-no-files-found: error
          retention-days: 7

  appimage:
    name: Build the Linux AppImage
    # Même règle que l'exe : à chaque PR et à chaque tag de version
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    # Ubuntu 22.04 : l'AppImage fonctionne ensuite avec la glibc 2.35 ou plus récente
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Check the tag
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' launcher/__init__.py)
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match launcher.__version__ ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install the build dependencies (Tcl/Tk with Xft)
        run: |
          bash packaging/ci_apt.sh build-essential libx11-dev libxft-dev libxss-dev libfontconfig-dev patchelf xvfb
      - name: Build
        run: bash packaging/appimage/build_appimage.sh dist
      - name: Smoke test (starts the AppImage under Xvfb)
        run: |
          APP="dist/StreamlinkLauncher-$VERSION-x86_64.AppImage"
          export APPIMAGE_EXTRACT_AND_RUN=1 HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config"
          mkdir -p "$HOME"
          # La fenêtre doit tenir 8 s sans erreur ; timeout l'arrête ensuite (code 124 = attendu)
          set +e
          xvfb-run -a timeout 8 "$APP" > run.log 2>&1
          code=$?
          set -e
          cat run.log
          fail() { echo "::error::$1"; sed 's/^/::error::  /' run.log | head -40; exit 1; }
          [ "$code" = "124" ] || fail "The AppImage exited early (code $code)"
          ! grep -q "Traceback" run.log || fail "Python traceback at start-up"
          [ -f "$XDG_CONFIG_HOME/streamlink-launcher/platforms.json" ] || fail "No data written to $XDG_CONFIG_HOME/streamlink-launcher"
      - name: Check the glibc requirement
        run: |
          mkdir x && cd x && "../dist/StreamlinkLauncher-$VERSION-x86_64.AppImage" --appimage-extract >/dev/null
          NEED=$(find squashfs-root/usr/python -name "*.so*" -o -path "*/bin/python3*" -type f | xargs objdump -T 2>/dev/null \
            | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1)
          echo "::notice::AppImage requires $NEED"
          [ "$(printf '%s\n' "$NEED" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "::error::$NEED > GLIBC_2.35"; exit 1; }
      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/StreamlinkLauncher-${{ env.VERSION }}-x86_64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 7

  linux-packages:
    name: Build the .deb and .rpm packages
    # Même contenu que l'AppImage, installé dans /opt ; testés en vrai sur Ubuntu 22.04 (.deb) et Fedora (.rpm)
    # Same content as the AppImage, installed in /opt; really tested on Ubuntu 22.04 (.deb) and Fedora (.rpm)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: appimage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Version
        run: echo "VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' launcher/__init__.py)" >> "$GITHUB_ENV"
      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: StreamlinkLauncher-${{ env.VERSION }}-x86_64.AppImage
          path: linux
      - name: Install rpmbuild and Xvfb
        run: bash packaging/ci_apt.sh rpm xvfb
      - name: Build
        run: |
          chmod +x "linux/StreamlinkLauncher-$VERSION-x86_64.AppImage"
          bash packaging/linux/build_packages.sh "linux/StreamlinkLauncher-$VERSION-x86_64.AppImage" dist
          dpkg-deb -I "dist/streamlink-launcher_${VERSION}_amd64.deb"
          rpm -qpi "dist/streamlink-launcher-$VERSION-1.x86_64.rpm"
          rpm -qpR "dist/streamlink-launcher-$VERSION-1.x86_64.rpm"
      - name: Install and start the .deb (Ubuntu 22.04)
        run: |
          sudo apt-get install -y -qq --no-install-recommends "./dist/streamlink-launcher_${VERSION}_amd64.deb"
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config"
          mkdir -p "$HOME"
          touch "$RUNNER_TEMP/stamp"
          set +e
          xvfb-run -a timeout 8 streamlink-launcher > run.log 2>&1
          code=$?
          set -e
          cat run.log
          fail() { echo "::error::$1"; sed 's/^/::error::  /' run.log | head -40; exit 1; }
          [ "$code" = "124" ] || fail "The .deb's launcher exited early (code $code)"
          ! grep -q "Traceback" run.log || fail "Python traceback at start-up"
          [ -f "$XDG_CONFIG_HOME/streamlink-launcher/platforms.json" ] || fail "No data written to ~/.config"
          [ -z "$(find /opt/streamlink-launcher -newer "$RUNNER_TEMP/stamp")" ] || fail "Data written to /opt"
          sudo apt-get remove -y -qq streamlink-launcher
          [ ! -e /usr/bin/streamlink-launcher ] || fail "The .deb did not uninstall cleanly"
      - name: Install and start the .rpm (Fedora 42)
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:42 bash -euc '
            dnf install -y -q --setopt=install_weak_deps=False "/dist/streamlink-launcher-'"$VERSION"'-1.x86_64.rpm" \
              xorg-x11-server-Xvfb >/dev/null
            Xvfb :99 -screen 0 1000x760x24 >/dev/null 2>&1 &
            sleep 2
            export DISPLAY=:99 HOME=/tmp/h XDG_CONFIG_HOME=/tmp/h/.config
            mkdir -p "$HOME"
            set +e
            timeout 8 streamlink-launcher > /tmp/run.log 2>&1
            code=$?
            set -e
            cat /tmp/run.log
            [ "$code" = 124 ] || { echo "::error::The .rpm launcher exited early (code $code)"; exit 1; }
            ! grep -q Traceback /tmp/run.log || { echo "::error::Python traceback at start-up"; exit 1; }
            [ -f /tmp/h/.config/streamlink-launcher/platforms.json ] || { echo "::error::No data in ~/.config"; exit 1; }
            # Lancé ici par root, qui peut écrire dans /opt : les données doivent quand même aller dans ~/.config
            # Started here by root, who can write to /opt: the data must still go to ~/.config
            [ ! -e /opt/streamlink-launcher/app/config.json ] || { echo "::error::Data written to /opt"; exit 1; }
            dnf remove -y -q streamlink-launcher >/dev/null
            [ ! -e /usr/bin/streamlink-launcher ] || { echo "::error::The .rpm did not uninstall cleanly"; exit 1; }'
      - name: Upload the .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/streamlink-launcher_${{ env.VERSION }}_amd64.deb
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Upload the .rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/streamlink-launcher-${{ env.VERSION }}-1.x86_64.rpm
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, appimage, linux-packages]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      EXE: StreamlinkLauncher-${{ needs.build.outputs.version }}.exe
      APPIMAGE: StreamlinkLauncher-${{ needs.build.outputs.version }}-x86_64.AppImage
      DEB: streamlink-launcher_${{ needs.build.outputs.version }}_amd64.deb
      RPM: streamlink-launcher-${{ needs.build.outputs.version }}-1.x86_64.rpm
      # Signature activée dès que la variable SIGNPATH_ORGANIZATION_ID existe (Settings > Secrets and variables > Actions)
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the unsigned executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.EXE }}
          path: unsigned
      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.APPIMAGE }}
          path: linux
      - name: Download the .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.DEB }}
          path: linux
      - name: Download the .rpm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.RPM }}
          path: linux
      - name: Sign with SignPath (SignPath Foundation certificate)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Streamlink-Launcher' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "3600"   # chaque release est approuvée à la main sur SignPath
          output-artifact-directory: signed
          skip-decompress: true
      - name: Check the signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "signed/$env:EXE"
          Write-Host "Status: $($sig.Status) — Signer: $($sig.SignerCertificate.Subject) — Timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Signature invalide : $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "Signature sans horodatage" }
      - name: Gather the files
        shell: bash
        run: |
          mkdir -p dist
          if [ "$SIGN" = "true" ]; then cp "signed/$EXE" dist/; else cp "unsigned/$EXE" dist/; fi
          cp "linux/$APPIMAGE" "linux/$DEB" "linux/$RPM" dist/
          cd dist && sha256sum "$EXE" "$APPIMAGE" "$DEB" "$RPM" > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          python packaging/release_notes.py "$VERSION" > release_notes.md
          HASH=$(sha256sum "dist/$EXE" | cut -d' ' -f1)
          HASH_LINUX=$(sha256sum "dist/$APPIMAGE" | cut -d' ' -f1)
          {
            echo
            echo "---"
            echo
            if [ "$SIGN" = "true" ]; then
              echo "**Signed executable** — free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). *Exécutable signé — signature gratuite fournie par SignPath.io, certificat de la SignPath Foundation.*"
            else
              echo "**Unsigned executable** — Windows SmartScreen may show a warning (*More info* → *Run anyway*). *Exécutable non signé — SmartScreen peut afficher un avertissement (Informations complémentaires → Exécuter quand même).*"
            fi
            echo
            echo "**Linux:** \`$APPIMAGE\` — \`chmod +x\` then run it (glibc 2.35+, e.g. Ubuntu 22.04, Debian 12, Fedora 36 or newer; Streamlink must be installed). *Linux : rendre le fichier exécutable puis le lancer.*"
            echo
            echo "**Packages:** \`$DEB\` (Debian, Ubuntu, Mint: \`sudo apt install ./$DEB\`) and \`$RPM\` (Fedora, openSUSE: \`sudo dnf install ./$RPM\`), same content as the AppImage, with a menu entry and the \`streamlink-launcher\` command. *Paquets : même contenu que l'AppImage, avec une entrée de menu et la commande streamlink-launcher.*"
            echo
            echo "SHA-256 \`$EXE\` \`$HASH\`"
            echo
            echo "SHA-256 \`$APPIMAGE\` \`$HASH_LINUX\`"
            echo
            echo "SHA-256 \`$DEB\` \`$(sha256sum "dist/$DEB" | cut -d' ' -f1)\`"
            echo
            echo "SHA-256 \`$RPM\` \`$(sha256sum "dist/$RPM" | cut -d' ' -f1)\`"
          } >> release_notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: Streamlink Launcher ${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            dist/${{ env.EXE }}
            dist/${{ env.APPIMAGE }}
            dist/${{ env.DEB }}
            dist/${{ env.RPM }}
            dist/SHA256SUMS.txt
