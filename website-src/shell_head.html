<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamlink Launcher &amp; Chat Docs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : la section Docs du site (mêmes jetons). Sommaire fixe à gauche, article à droite,
   recherche qui filtre tous les blocs ; sur téléphone, le sommaire devient une bande défilante. */
:root {
  --bg: #E9ECF1; --surface: #F7F8FA; --raised: #FFFFFF; --ink: #13151B; --muted: #586071; --line: #CDD2DB;
  --term: #171A21; --term-ink: #DCE0E8; --term-dim: #7D8597;
  --p: #9146FF; --p-on: #FFFFFF; --accent-ink: #6E2BD9;
  --launcher: #6E2BD9; --chat: #1C6896; --warn-bg: #FFF4D6; --warn-ink: #7A5200; --mark: #FFE58A;
  --tip-bg: #E3F1FA; --tip-ink: #154F73; --shade: rgba(10, 12, 16, .82);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1116; --surface: #161920; --raised: #1C2029; --ink: #ECEEF3; --muted: #959CAD; --line: #2A2F3A;
    --term: #0A0C10; --term-ink: #DCE0E8; --term-dim: #6F7789; --accent-ink: #B794FF;
    --launcher: #B794FF; --chat: #7FCBF5; --warn-bg: #3A2F12; --warn-ink: #F5D27A; --mark: #6B5A12;
    --tip-bg: #12293A; --tip-ink: #A9D8F5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1116; --surface: #161920; --raised: #1C2029; --ink: #ECEEF3; --muted: #959CAD; --line: #2A2F3A;
  --term: #0A0C10; --term-ink: #DCE0E8; --term-dim: #6F7789; --accent-ink: #B794FF;
  --launcher: #B794FF; --chat: #7FCBF5; --warn-bg: #3A2F12; --warn-ink: #F5D27A; --mark: #6B5A12;
  --tip-bg: #12293A; --tip-ink: #A9D8F5; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.65; -webkit-font-smoothing: antialiased; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: .05em .35em; overflow-wrap: anywhere; }
kbd { font-family: var(--font-mono); font-size: .82em; padding: .1em .45em; border-radius: 5px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--raised); white-space: nowrap; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { padding-block: 18px; border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink); text-decoration: none; }
.brand svg { width: 30px; height: 30px; }
.nav { display: flex; gap: 6px 20px; flex-wrap: wrap; font-size: .82rem; font-weight: 500; }
.nav a { color: var(--muted); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--p); text-decoration-thickness: 2px; text-underline-offset: 6px; }

.intro { padding-block: clamp(32px, 6vw, 64px) 28px; display: grid; gap: 16px; }
.tag { font-family: var(--font-mono); font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.tag .num { border: 1px solid var(--ink); color: var(--ink); padding: 1px 8px; border-radius: 4px; }
.intro > * { min-width: 0; }
.intro h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(2.3rem, 10vw, 5.6rem); overflow-wrap: anywhere; line-height: .9; text-transform: uppercase; }
.intro p { color: var(--muted); font-size: 1.15rem; max-width: 62ch; }
.search { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; margin-top: 8px; }
.search:focus-within { border-color: var(--p); box-shadow: 0 0 0 4px color-mix(in srgb, var(--p) 24%, transparent); }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; padding-block: 13px; outline: none; }
.search .count { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); white-space: nowrap; }
.search input { font-size: 1.05rem; }
.syn { font-size: .85rem; color: var(--muted); min-height: 1.4em; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.quick a { font-size: .85rem; font-weight: 600; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
.quick a:hover { border-color: var(--p); }

.layout > * { min-width: 0; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); padding-bottom: 80px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); max-height: calc(100vh - 40px); overflow-y: auto; display: grid; gap: 1px; font-size: .88rem; scrollbar-width: thin; }
.toc b { font-family: var(--font-mono); font-size: .72rem; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 10px 0 6px; }
.toc b:first-child { margin-top: 0; }
.toc a { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 4px; color: var(--muted); text-decoration: none; padding: 5px 10px; border-radius: 8px; border-left: 2px solid transparent; }
.toc a span { font-family: var(--font-mono); font-size: .75rem; padding-top: .15em; }
.toc a:hover { color: var(--ink); background: var(--surface); }
.toc a.on { color: var(--ink); background: var(--surface); border-left-color: var(--p); font-weight: 600; }
.toc a.dim { opacity: .35; }

article { display: grid; gap: clamp(48px, 7vw, 80px); min-width: 0; }
section.doc { display: grid; gap: 18px; scroll-margin-top: 20px; min-width: 0; }
section.doc > * { min-width: 0; }
section.doc > header { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
section.doc > header small { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
section.doc h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 3.6vw, 2.6rem); line-height: 1; text-transform: uppercase; }
.lead { color: var(--muted); font-size: 1.05rem; max-width: 70ch; }
.blk { display: grid; gap: 10px; min-width: 0; }
.blk h3 { font-size: 1.08rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.blk p, .blk li { color: color-mix(in srgb, var(--ink) 82%, var(--muted)); max-width: 72ch; }
.blk ul, .blk ol { margin: 0; padding-left: 1.25rem; display: grid; gap: 6px; }
.app { font-family: var(--font-mono); font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; line-height: 1.6; }
.app.l { color: var(--launcher); } .app.c { color: var(--chat); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.card h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; text-transform: uppercase; line-height: 1; }
.card p { color: var(--muted); font-size: .95rem; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-weight: 500; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
td kbd { margin-block: 1px; display: inline-block; }
.term { background: var(--term); color: var(--term-ink); border-radius: 10px; padding: 12px 14px; padding-right: 76px; font-family: var(--font-mono); font-size: .86rem; line-height: 1.6; overflow-x: auto; white-space: pre; position: relative; }
.term .pr { color: var(--term-dim); user-select: none; }
.term .cm { color: var(--term-dim); }
.term button { position: absolute; top: 8px; right: 8px; border: 1px solid #3A3F4B; background: var(--term); color: var(--term-ink); border-radius: 6px; font: inherit; font-size: .72rem; padding: 2px 8px; cursor: pointer; }
.term .fn { display: block; color: var(--term-dim); font-size: .75rem; margin-bottom: 4px; user-select: none; }
.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 12px 14px; font-size: .93rem; max-width: 72ch; }
.note b { font-weight: 700; }
.tip { background: var(--tip-bg); color: var(--tip-ink); border-radius: 10px; padding: 12px 14px; font-size: .93rem; max-width: 72ch; }
.tip code { background: transparent; border-color: color-mix(in srgb, var(--tip-ink) 30%, transparent); }
.path { font-family: var(--font-mono); font-size: .85em; overflow-wrap: anywhere; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; font-size: .9rem; font-weight: 600; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.js .pane:not(.on) { display: none; }
.pane { display: grid; gap: 14px; }

.shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.shots.tall { grid-template-columns: repeat(3, minmax(0, 1fr)); }
figure { margin: 0; display: grid; gap: 8px; align-content: start; }
figure .zoom { display: block; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); cursor: zoom-in; width: 100%; }
figure img { display: block; width: 100%; height: auto; }
figure .zoom:hover { border-color: var(--p); }
figcaption { font-size: .88rem; color: var(--muted); }
figcaption b { color: var(--ink); font-weight: 600; }
figure.wide { grid-column: 1 / -1; }
dialog.lb { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1100px); max-height: 94vh; }
dialog.lb::backdrop { background: var(--shade); }
dialog.lb img { display: block; max-width: 100%; max-height: 86vh; width: auto; height: auto; border-radius: 10px; margin: 0 auto; }
dialog.lb p { color: #E6E8EE; text-align: center; font-size: .9rem; padding: 10px 8px 0; }
dialog.lb button { position: fixed; top: 14px; right: 14px; border: 1px solid #444A57; background: #1C2029; color: #fff; border-radius: 999px; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; }

.steps { counter-reset: s; list-style: none; padding: 0 !important; display: grid; gap: 12px !important; }
.steps > li { counter-increment: s; position: relative; padding-left: 40px; }
.steps > li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: .8rem; display: grid; place-items: center; }

.gl-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
.gl { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 4px 20px; padding: 12px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 20px; }
.gl dt { font-weight: 700; }
.gl dd { margin: 0; color: color-mix(in srgb, var(--ink) 82%, var(--muted)); max-width: 68ch; }
.gl:target { background: color-mix(in srgb, var(--p) 10%, transparent); }
.letters { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--font-mono); font-size: .8rem; }
.letters a { text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--muted); }

details.faq { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.faq summary { cursor: pointer; list-style: none; padding: 14px 44px 14px 16px; font-weight: 600; position: relative; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary::after { content: "+"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 1.2rem; color: var(--muted); }
details.faq[open] summary::after { content: "–"; }
details.faq .a { padding: 0 16px 16px; display: grid; gap: 10px; }
details.faq .a p, details.faq .a li { color: color-mix(in srgb, var(--ink) 82%, var(--muted)); max-width: 70ch; }
details.faq .a ol, details.faq .a ul { margin: 0; padding-left: 1.25rem; display: grid; gap: 4px; }
.faqs { display: grid; gap: 8px; }
.empty { color: var(--muted); font-style: italic; }
.hidden-by-search { display: none !important; }
footer { border-top: 1px solid var(--line); padding-block: 28px 40px; color: var(--muted); font-size: .82rem; }

@media (max-width: 880px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .toc { position: static; max-height: none; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; margin-inline: -4px; }
  .toc b { display: none; }
  .toc a { flex: none; grid-template-columns: auto auto; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
  .toc a.on { border-color: var(--p); }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .shots.tall { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .shots { grid-template-columns: minmax(0, 1fr); }
  .gl { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* Menu de langue dans l'en-tête */
.top-right { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.langsel { position: relative; display: inline-flex; align-items: center; }
.langsel svg { position: absolute; left: 10px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.langsel::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.langsel select { appearance: none; -webkit-appearance: none; font: inherit; font-size: .85rem; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 32px 6px 32px; cursor: pointer; }
.langsel select:hover { border-color: var(--p); }
.langsel select:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#9146FF"/><path d="M12.5 9.6v12.8c0 .8.9 1.3 1.6.8l9.6-6.4c.6-.4.6-1.2 0-1.6l-9.6-6.4c-.7-.5-1.6 0-1.6.8z" fill="#fff"/></symbol>
  <symbol id="i-globe" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 10h15M10 2.5c2.2 2.3 3.2 4.8 3.2 7.5s-1 5.2-3.2 7.5c-2.2-2.3-3.2-4.8-3.2-7.5s1-5.2 3.2-7.5z" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.6 12.6 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</defs></svg>


<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><svg aria-hidden="true"><use href="#logo"/></svg>Streamlink Launcher <span style="color:var(--muted);font-weight:500">&amp; Chat</span></a>
    <div class="top-right">
      <nav class="nav" aria-label="Site">
        <a href="#">Launcher</a><a href="#">Chat</a><a href="#" aria-current="page">Docs</a><a href="#" data-fr="Télécharger" data-en="Download">Télécharger</a>
